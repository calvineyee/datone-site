<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Datone · Improvement Proposals</title>
<style>
  :root{--bg:#0e1116;--panel:#161b22;--panel2:#1c2230;--border:#2a3140;--text:#e6edf3;
        --muted:#8a94a6;--accent:#4c8dff;--green:#2ea043;--red:#d1414a;--amber:#c8912a;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--border);}
  header h1{font-size:17px;margin:0;font-weight:600;}
  header .sub{color:var(--muted);font-size:13px;}
  .wrap{max-width:940px;margin:0 auto;padding:22px;}
  .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filters button{background:var(--panel);border:1px solid var(--border);color:var(--muted);
    border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;transition:.15s;}
  .filters button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;}
  .card .top{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;}
  .card h3{margin:0 0 6px;font-size:15.5px;font-weight:600;}
  .card p{margin:0;color:var(--muted);font-size:13.5px;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0;}
  .tag{font-size:11px;padding:2px 9px;border-radius:6px;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
  .tag.risk-high{color:#ff9ea3;border-color:#5a2b30;background:#2a1618;}
  .tag.risk-medium{color:#e6c17a;border-color:#4a3a1c;background:#231d10;}
  .tag.risk-low{color:#9ad6a6;border-color:#234a2c;background:#132018;}
  .st{font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap;}
  .st-submitted{background:#132a4a;color:#89b8ff;}
  .st-approved{background:#132a18;color:#6ede89;}
  .st-rejected{background:#2a1416;color:#ff9098;}
  .st-applied{background:#1c2230;color:#b6c2d9;}
  .st-under_review{background:#2a2410;color:#e6c17a;}
  .st-withdrawn{background:#1c2230;color:#8a94a6;}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .acts button{border:1px solid var(--border);background:var(--panel2);color:var(--text);
    border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;transition:.12s;}
  .acts button:hover{transform:translateY(-1px);}
  .acts .approve{border-color:#234a2c;color:#9ad6a6;}
  .acts .approve:hover{background:#132018;}
  .acts .reject{border-color:#5a2b30;color:#ff9ea3;}
  .acts .reject:hover{background:#2a1618;}
  .meta{color:#5f6b7d;font-size:11.5px;margin-top:10px;}
  .rev{color:var(--muted);font-size:12.5px;margin-top:8px;border-left:2px solid var(--border);padding-left:10px;}
  .empty,.gate{text-align:center;color:var(--muted);padding:60px 20px;}
  .gate a{color:var(--accent);}
  .spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:sp 1s linear infinite;margin:60px auto;}
  @keyframes sp{to{transform:rotate(360deg)}}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px;}
</style>
</head>
<body>
<header>
  <h1>🔄 Improvement Proposals</h1>
  <span class="sub" id="hdr-sub">Datone self-improvement flywheel</span>
</header>
<div class="wrap">
  <div class="filters" id="filters" style="display:none">
    <button data-s="" class="on">All</button>
    <button data-s="submitted">To review</button>
    <button data-s="approved">Approved</button>
    <button data-s="applied">Applied</button>
    <button data-s="rejected">Rejected</button>
  </div>
  <div id="body"><div class="spin"></div></div>
</div>
<script>
const API = '/api';
let _filter = '', _all = [];

async function api(path, opts = {}) {
  const res = await fetch(API + path, {
    credentials: 'include',
    headers: {'Content-Type': 'application/json', ...(opts.headers || {})},
    ...opts,
  });
  if (!res.ok) { try { return await res.json(); } catch { return {ok:false, message:res.statusText, _code:res.status}; } }
  return res.json();
}
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}

async function init() {
  const who = await api('/login/whoami');
  if (!who || !who.ok) {
    document.getElementById('body').innerHTML =
      '<div class="gate">Please sign in on <a href="/consume">datone.live/consume</a> first, then reload this page.</div>';
    return;
  }
  await load();
}

async function load() {
  const r = await api('/proposals' + (_filter ? ('?status=' + _filter) : ''));
  const body = document.getElementById('body');
  if (r && r._code === 403) {
    body.innerHTML = '<div class="gate">This console is limited to Datone admins.</div>';
    return;
  }
  if (!r || !r.ok) { body.innerHTML = '<div class="gate">Could not load proposals.</div>'; return; }
  _all = r.proposals || [];
  document.getElementById('filters').style.display = 'flex';
  const sub = document.getElementById('hdr-sub');
  const pending = _all.filter(p => p.status === 'submitted').length;
  sub.innerHTML = '<span class="dot"></span>' + _all.length + ' proposals · ' + pending + ' awaiting review';
  render();
}

function render() {
  const body = document.getElementById('body');
  const list = _filter ? _all.filter(p => p.status === _filter) : _all;
  if (!list.length) { body.innerHTML = '<div class="empty">Nothing here. The weekly job files new proposals every Monday.</div>'; return; }
  body.innerHTML = list.map(cardHtml).join('');
  body.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', onAct));
}

function cardHtml(p) {
  const acts = (p.status === 'submitted' || p.status === 'under_review')
    ? '<div class="acts">' +
        '<button class="approve" data-act="approve" data-id="' + esc(p.proposal_id) + '">✓ Approve</button>' +
        '<button class="reject" data-act="reject" data-id="' + esc(p.proposal_id) + '">✕ Reject</button>' +
      '</div>' : '';
  const rev = p.review_notes ? '<div class="rev">📝 ' + esc(p.review_notes) + (p.reviewed_by ? ' — ' + esc(p.reviewed_by) : '') + '</div>' : '';
  return '<div class="card">' +
    '<div class="top"><div><h3>' + esc(p.title) + '</h3></div>' +
      '<span class="st st-' + esc(p.status) + '">' + esc(p.status.replace('_',' ')) + '</span></div>' +
    '<p>' + esc(p.description || '') + '</p>' +
    '<div class="tags">' +
      '<span class="tag risk-' + esc(p.risk_level) + '">' + esc(p.risk_level) + ' risk</span>' +
      '<span class="tag">' + esc(p.type) + '</span>' +
      (p.entity_slug ? '<span class="tag">' + esc(p.entity_slug) + '</span>' : '') +
    '</div>' + rev + acts +
    '<div class="meta">' + esc(p.proposal_id) + ' · by ' + esc(p.proposed_by_agent || '—') + ' · ' + esc((p.created_at||'').slice(0,16)) + '</div>' +
  '</div>';
}

async function onAct(e) {
  const btn = e.currentTarget;
  const id = btn.getAttribute('data-id');
  const action = btn.getAttribute('data-act');
  let notes = '';
  if (action === 'reject') { notes = (prompt('Reason for rejecting? (optional)') || '').slice(0,500); }
  else { notes = (prompt('Note (optional) — e.g. who will do it') || '').slice(0,500); }
  btn.disabled = true; btn.textContent = '…';
  const r = await api('/proposals/' + encodeURIComponent(id) + '/review', {
    method: 'POST', body: JSON.stringify({action, notes}),
  });
  if (r && r.ok) { await load(); }
  else { alert((r && r.message) || 'Failed'); btn.disabled = false; }
}

document.getElementById('filters').addEventListener('click', function (e) {
  const b = e.target.closest('button[data-s]'); if (!b) return;
  _filter = b.getAttribute('data-s');
  this.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  render();
});

init();
</script>
</body>
</html>
